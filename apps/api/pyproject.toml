[project]
name = "contentcreator-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "pydantic>=2.11.0,<3.0",
    "pydantic-settings>=2.9.0,<3.0",
    "python-dotenv>=1.1.0,<2.0",
    "httpx>=0.28.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0",
    "aiomysql>=0.2.0,<1.0",
    "cryptography>=44.0.0,<46.0",
    "pyjwt>=2.10,<3.0",
    "bcrypt>=4.2,<5.0",
    "python-multipart>=0.0.20,<1.0",
    "langchain>=1.0.0,<2.0",
    "langchain-openai>=0.3.0,<1.0",
    "llama-index-core>=0.12.0,<1.0",
    "llama-index-embeddings-fastembed>=0.4.0,<1.0",
    "fastembed>=0.4.0,<1.0",
    "llama-index-vector-stores-chroma>=0.4.0,<1.0",
    "pypdf>=5.0,<7.0",
    "docx2txt>=0.8,<1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0,<1.0",
    "mypy>=1.15.0,<2.0",
    "debugpy>=1.8.21",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
