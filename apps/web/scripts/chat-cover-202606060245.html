<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=2160" />
    <title>开源快赶上闭源了？</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 1080px;
        height: 2160px;
        overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
        background: linear-gradient(180deg, #f3f3f3 0%, #ececec 50%, #e4eee6 100%);
        position: relative;
      }

      .bg-bubble {
        position: absolute;
        border-radius: 999px;
        border: 2px solid rgba(149, 236, 105, 0.15);
        background: rgba(255, 255, 255, 0.35);
      }

      .bg-bubble-1 {
        width: 280px;
        height: 280px;
        top: 120px;
        right: -90px;
      }

      .bg-bubble-2 {
        width: 200px;
        height: 200px;
        bottom: 320px;
        left: -60px;
      }

      .wave {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 240px;
        background: linear-gradient(
          180deg,
          rgba(149, 236, 105, 0) 0%,
          rgba(149, 236, 105, 0.12) 100%
        );
      }

      .dots {
        position: absolute;
        right: 48px;
        bottom: 48px;
        width: 96px;
        height: 96px;
        opacity: 0.25;
        background-image: radial-gradient(circle, #999 1.5px, transparent 1.5px);
        background-size: 14px 14px;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 160px 180px;
      }

      .safe-zone {
        width: 100%;
        max-width: 920px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      .chat-block {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 80px;
      }

      .msg {
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }

      .msg.outgoing {
        flex-direction: row-reverse;
      }

      .avatar {
        width: 72px;
        height: 72px;
        border-radius: 10px;
        object-fit: cover;
        flex-shrink: 0;
      }

      .avatar-other {
        border-radius: 999px;
      }

      .bubble {
        max-width: 440px;
        padding: 16px 20px;
        border-radius: 12px;
        font-size: 28px;
        line-height: 1.4;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }

      .bubble-in {
        background: #fff;
        color: #1a1a1a;
      }

      .bubble-out {
        background: #95ec69;
        color: #1a1a1a;
      }

      .title {
        font-size: 58px;
        font-weight: 700;
        color: #1a1a1a;
        text-align: center;
        line-height: 1.35;
        letter-spacing: 1px;
        white-space: nowrap;
      }

      .title .highlight {
        color: #07c160;
      }

      .subtitle {
        margin-top: 28px;
        font-size: 24px;
        color: #888;
        text-align: center;
        letter-spacing: 1px;
      }

      .wechat-icon {
        position: absolute;
        left: 48px;
        bottom: 48px;
        width: 48px;
        height: 48px;
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <div class="bg-bubble bg-bubble-1"></div>
    <div class="bg-bubble bg-bubble-2"></div>
    <div class="wave"></div>
    <div class="dots"></div>

    <div class="content">
      <div class="safe-zone">
        <div class="chat-block">
          <div class="msg incoming">
            <img class="avatar avatar-other" src="../public/avatar-other.png" alt="" />
            <div class="bubble bubble-in">开源快赶上闭源了？</div>
          </div>
          <div class="msg outgoing">
            <img class="avatar" src="../public/avatar-self.png" alt="" />
            <div class="bubble bubble-out">经典抖音科研</div>
          </div>
        </div>

        <h1 class="title">开源真能<span class="highlight">追上</span>闭源？</h1>
        <p class="subtitle">豆包 × DeepSeek · 虚构娱乐</p>
      </div>
    </div>

    <svg class="wechat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M8.5 4C4.9 4 2 6.4 2 9.3c0 1.6.9 3 2.3 3.9L3.5 16l3.1-1.5c.6.1 1.2.2 1.9.2 3.6 0 6.5-2.4 6.5-5.3C15 6.4 12.1 4 8.5 4zm-2 4.8c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm4 0c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z"
        fill="#07C160"
      />
      <path
        d="M22 13.5c0-2.5-2.4-4.5-5.3-4.5-3 0-5.3 2-5.3 4.5s2.4 4.5 5.3 4.5c.6 0 1.2-.1 1.7-.2l2.6 1.2-.7-2.3c1.1-.8 1.7-2 1.7-3.2zM15 13c-.4 0-.8-.3-.8-.8s.3-.8.8-.8.8.3.8.8-.4.8-.8.8zm3.5 0c-.4 0-.8-.3-.8-.8s.3-.8.8-.8.8.3.8.8-.4.8-.8.8z"
        fill="#07C160"
      />
    </svg>
  </body>
</html>
