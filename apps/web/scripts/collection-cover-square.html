<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>豆包找 DeepSeek 聊天</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
        background: linear-gradient(180deg, #f3f3f3 0%, #e8e8e8 100%);
        position: relative;
      }

      .bg-bubble {
        position: absolute;
        border-radius: 999px;
        border: 2px solid rgba(149, 236, 105, 0.15);
        background: rgba(255, 255, 255, 0.35);
      }

      .bg-bubble-1 {
        width: 280px;
        height: 280px;
        top: 40px;
        right: -60px;
      }

      .bg-bubble-2 {
        width: 180px;
        height: 180px;
        bottom: 120px;
        left: -40px;
      }

      .wave {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 180px;
        background: linear-gradient(
          180deg,
          rgba(149, 236, 105, 0) 0%,
          rgba(149, 236, 105, 0.12) 100%
        );
      }

      .dots {
        position: absolute;
        right: 48px;
        bottom: 48px;
        width: 120px;
        height: 120px;
        opacity: 0.25;
        background-image: radial-gradient(circle, #999 1.5px, transparent 1.5px);
        background-size: 16px 16px;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 80px 64px;
      }

      .chat-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        margin-bottom: 72px;
      }

      .avatar {
        width: 160px;
        height: 160px;
        border-radius: 16px;
        object-fit: cover;
        flex-shrink: 0;
      }

      .avatar-other {
        border-radius: 999px;
      }

      .bubbles {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 120px;
      }

      .bubble {
        padding: 14px 22px;
        border-radius: 12px;
        font-size: 28px;
        line-height: 1.2;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }

      .bubble-in {
        background: #fff;
        color: #1a1a1a;
        align-self: flex-start;
      }

      .bubble-out {
        background: #95ec69;
        color: #1a1a1a;
        align-self: flex-end;
      }

      .title {
        font-size: 64px;
        font-weight: 700;
        color: #1a1a1a;
        text-align: center;
        line-height: 1.25;
        letter-spacing: 1px;
      }

      .subtitle {
        margin-top: 24px;
        font-size: 30px;
        color: #888;
        text-align: center;
        letter-spacing: 2px;
      }

      .wechat-icon {
        position: absolute;
        left: 48px;
        bottom: 48px;
        width: 56px;
        height: 56px;
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <div class="bg-bubble bg-bubble-1"></div>
    <div class="bg-bubble bg-bubble-2"></div>
    <div class="wave"></div>
    <div class="dots"></div>

    <div class="content">
      <div class="chat-row">
        <img class="avatar avatar-other" src="../public/avatar-other.png" alt="" />
        <div class="bubbles">
          <div class="bubble bubble-in">在吗</div>
          <div class="bubble bubble-out">在</div>
        </div>
        <img class="avatar" src="../public/avatar-self.png" alt="" />
      </div>

      <h1 class="title">豆包找 DeepSeek 聊天</h1>
      <p class="subtitle">AI 微信闲聊 · 虚构娱乐</p>
    </div>

    <svg class="wechat-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M8.5 4C4.9 4 2 6.4 2 9.3c0 1.6.9 3 2.3 3.9L3.5 16l3.1-1.5c.6.1 1.2.2 1.9.2 3.6 0 6.5-2.4 6.5-5.3C15 6.4 12.1 4 8.5 4zm-2 4.8c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm4 0c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z"
        fill="#07C160"
      />
      <path
        d="M22 13.5c0-2.5-2.4-4.5-5.3-4.5-3 0-5.3 2-5.3 4.5s2.4 4.5 5.3 4.5c.6 0 1.2-.1 1.7-.2l2.6 1.2-.7-2.3c1.1-.8 1.7-2 1.7-3.2zM15 13c-.4 0-.8-.3-.8-.8s.3-.8.8-.8.8.3.8.8-.4.8-.8.8zm3.5 0c-.4 0-.8-.3-.8-.8s.3-.8.8-.8.8.3.8.8-.4.8-.8.8z"
        fill="#07C160"
      />
    </svg>
  </body>
</html>
